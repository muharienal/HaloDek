<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263A86">
<title>Sedang offline · HaloDek</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#fff;
       background:radial-gradient(600px 300px at 0 0,rgba(18,183,160,.35),transparent 70%),linear-gradient(160deg,#1A2858,#314AA7)}
  .box{max-width:380px;text-align:center}
  img{width:84px;height:84px;border-radius:22px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
  h1{font-size:24px;margin:20px 0 8px}
  p{margin:0 0 22px;line-height:1.55;opacity:.9}
  button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 22px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#FF9A3C,#FF6B3D)}
</style>
</head>
<body>
<div class="box">
  <img src="images/halodek-icon.svg" alt="HaloDek" width="84" height="84">
  <h1>Anda sedang offline</h1>
  <p>HaloDek membutuhkan koneksi ke jaringan kantor untuk menampilkan dan mengirim laporan. Periksa Wi-Fi atau data seluler Anda, lalu coba lagi.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</div>
</body>
</html>
